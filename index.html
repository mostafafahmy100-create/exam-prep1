<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning English – Mr. Mostafa Nasar | Prep 1 Exams</title>
<style>:root{--bg:#eef4fb;--card:#fff;--text:#14233a;--muted:#5a6b7f;--brand:#1361a1;--bt:#0f5190;--soft:#dcebfa;--pill:#ffa726;--line:#d2deec;--okbg:#d9f5e3;--ok:#0f7a3e;--badbg:#fde0e0;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1624;--card:#16233a;--text:#e8eefa;--muted:#9fb1cc;--line:#27395a;--brand:#1a6fb8;--bt:#8cc4ff;--soft:#1d3355;--okbg:#14412a;--ok:#7be3a6;--badbg:#4a1c1c;--bad:#ff9a9a}}
:root[data-theme="dark"]{--bg:#0d1624;--card:#16233a;--text:#e8eefa;--muted:#9fb1cc;--line:#27395a;--brand:#1a6fb8;--bt:#8cc4ff;--soft:#1d3355;--okbg:#14412a;--ok:#7be3a6;--badbg:#4a1c1c;--bad:#ff9a9a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 40px}
header{background:linear-gradient(160deg,#12579c,#1874b3);color:#fff;text-align:center;padding:20px 16px 30px;border-radius:0 0 34px 34px;margin:0 -14px 16px}
.logo{width:96px;height:96px;border-radius:50%;border:3px solid var(--pill);object-fit:cover;background:#fff}
h1{margin:10px 0 2px;font-size:24px;line-height:1.2}header p{margin:2px 0 0;opacity:.92}
.tag{display:inline-block;background:var(--pill);color:#3a2200;font-weight:700;padding:4px 14px;border-radius:20px;margin-top:8px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
label{font-size:13px;color:var(--muted);display:block;margin:8px 0 3px}
input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 11px}
h2{font-size:16px;color:var(--bt);margin:0 0 8px}
.top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}.fill{height:100%;background:var(--brand);transition:width .3s}
.qt{font-weight:700;font-size:17px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opts button,.btn{font:inherit;cursor:pointer;color:var(--text);background:var(--card);border:2px solid var(--line);border-radius:10px;padding:11px 14px;text-align:left}
.opts button:hover:not(:disabled){border-color:var(--bt)}.opts button:disabled{cursor:default;color:var(--text)}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important;color:var(--ok)!important;font-weight:700}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important;color:var(--bad)!important;font-weight:700}
.btn{background:var(--brand);color:#fff;border-color:var(--bt);font-weight:700;text-align:center;text-decoration:none;display:inline-block}
.btn.alt{background:var(--card);color:var(--bt)}.btn:disabled{opacity:.5;cursor:default}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.rev{width:100%;margin-top:12px;font-size:17px;padding:14px;background:linear-gradient(135deg,#f58a07,#ffa726);color:#3a2200;border-color:#f58a07}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.score{font-size:50px;font-weight:800;color:var(--bt);line-height:1.1;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:10px}.stats b{display:block;font-size:22px}
.mist{border-top:1px dashed var(--line);padding:8px 0;font-size:15px}.mist b{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4}
.tabs button{flex:none;font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:7px 14px}
.tabs button.on{background:var(--brand);border-color:var(--bt);color:#fff}
.tools{display:flex;gap:8px;margin-bottom:10px}.tools input{flex:1}
.vc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.vc b{font-size:17px}.vc small{color:var(--muted);margin-left:6px}.ar{direction:rtl;color:var(--bt);font-weight:700;cursor:pointer}.hide .ar{filter:blur(7px)}.hide .ar.sh{filter:none}
.sp{background:none;border:0;font-size:20px;cursor:pointer}
table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--bt);font-size:14px}
details{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card)}summary{cursor:pointer;font-weight:700;padding:12px 14px;color:var(--bt)}
details div{padding:0 14px 12px}.ex{background:var(--bg);border-left:4px solid var(--brand);padding:8px 10px;border-radius:8px}
.scale{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.scale span{background:var(--soft);color:var(--bt);padding:3px 10px;border-radius:14px;font-size:13px;font-weight:700}
.soc{display:flex;gap:14px;justify-content:center;margin-top:14px}
.soc a{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.35);border:2px solid #fff}.soc svg{width:26px;height:26px;fill:#fff}
.wa{background:#25d366}.tt{background:#000}
footer{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}footer a{color:var(--bt);font-weight:700;text-decoration:none}
.hidden{display:none}
.a2{display:block;direction:rtl;text-align:left;color:var(--bt);font-weight:700;font-size:14px}
.arn{direction:rtl;text-align:right;background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:10px}.arn p{margin:6px 0}.arn .ex{direction:rtl;border-left:0;border-right:4px solid var(--brand);background:var(--card)}
</style></head><body><div class="wrap">

-known", "معروف"], ["unknown", "غير معروف"]], [["healthy", "صحّي / سليم"], ["well", "بصحة جيدة"], ["unhealthy", "غير صحّي"]], [["dedication", "إخلاص / تفانٍ"], ["hard work", "اجتهاد"], ["carelessness", "إهمال"]]], "AF": [["e-", "means “electronic”", "تفيد معنى «إلكتروني»", "ebook", "كتاب إلكتروني"], ["micro-", "means “very small”", "تفيد معنى «صغير جدًا»", "microphone", "ميكروفون"], ["trans-", "means “move across”", "تفيد معنى «نقل / عبر»", "transplant", "يزرع / ينقل (عضو)"], ["-al", "noun → adjective", "تحوّل الاسم إلى صفة", "digital", "رقمي"], ["-ful", "noun → adjective", "تحوّل الاسم إلى صفة (مليء بـ)", "respectful, colorful, powerful", "محترم، ملوّن، قوي"], ["-able", "verb → adjective", "تحوّل الفعل إلى صفة (يمكن أن)", "enjoyable", "ممتع"], ["-ment", "verb → noun", "تحوّل الفعل إلى اسم", "assignment, agreement", "واجب / مهمة، اتفاق"], ["-ation / -ion", "verb → noun", "تحوّل الفعل إلى اسم", "determination, admiration, communication", "عزيمة، إعجاب، تواصل"], ["-ship", "forms a noun", "تكوّن اسمًا", "leadership", "قيادة"], ["-th", "adjective → noun", "تحوّل الصفة إلى اسم", "strength", "قوة"], ["-ness", "adjective → noun", "تحوّل الصفة إلى اسم", "kindness", "لطف"], ["-er", "verb → noun (person / thing)", "تحوّل الفعل إلى اسم (من يفعل الشيء)", "learner, recorder", "متعلّم، مسجّل"]], "G": [["1. Present Simple & Adverbs of Frequency", "<p><b>Form:</b> (I / We / You / They) + base verb · (He / She / It) + verb + s / es / ies</p><p><b>Negative:</b> don’t / doesn’t + base verb · <b>Questions:</b> Do / Does + subject + base verb …?</p><p><b>Use:</b> facts, habits &amp; daily routines, things that don’t change, describing yourself.</p><div class=\"scale\"><span>never 0%</span><span>rarely 10%</span><span>sometimes 50%</span><span>often 70%</span><span>usually 90%</span><span>always 100%</span></div><p class=\"ex\">How often do you go to the swimming pool? → I sometimes go to the swimming pool.</p>", "<p><b>المضارع البسيط:</b> نستخدمه للتعبير عن الحقائق، والعادات، والروتين اليومي، والأشياء التي لا تتغير، ووصف النفس.</p><p><b>التكوين:</b> مع I / We / You / They نستخدم المصدر (الفعل بدون تغيير)، ومع He / She / It نضيف s أو es أو ies للفعل.</p><p><b>النفي:</b> don’t مع I / We / You / They، و doesn’t مع He / She / It + المصدر.</p><p><b>السؤال:</b> Do / Does + الفاعل + المصدر؟</p><p><b>ظروف التكرار</b> (تأتي قبل الفعل الأساسي): never أبدًا · rarely نادرًا · sometimes أحيانًا · often غالبًا · usually عادةً · always دائمًا. وللسؤال عن عدد المرات نستخدم How often…؟</p><p class=\"ex\">How often do you go to the swimming pool? = كم مرة تذهب إلى حمام السباحة؟<br>I sometimes go to the swimming pool. = أحيانًا أذهب إلى حمام السباحة.</p>"], ["2. Can / Can’t (Ability)", "<p><b>Form:</b> subject + can / can’t + base verb</p><p><b>Questions:</b> Can + subject + base verb …? · Wh- + can + subject + base verb …?</p><p class=\"ex\">I can do this work alone. · I can’t complete this work alone, it’s difficult.</p><p class=\"ex\">Can you play chess? · What can you do to keep the environment clean?</p>", "<p><b>can / can’t:</b> نستخدم can للتعبير عن القدرة (يستطيع)، و can’t / cannot لنفي القدرة (لا يستطيع).</p><p><b>التكوين:</b> الفاعل + can / can’t + المصدر (بدون to).</p><p><b>السؤال:</b> Can + الفاعل + المصدر؟ أو Wh- + can + الفاعل + المصدر؟</p><p class=\"ex\">I can do this work alone. = أستطيع القيام بهذا العمل وحدي.<br>I can’t complete this work alone, it’s difficult. = لا أستطيع إكمال هذا العمل وحدي، إنه صعب.<br>Can you play chess? = هل تستطيع لعب الشطرنج؟<br>What can you do to keep the environment clean? = ماذا تستطيع أن تفعل للحفاظ على نظافة البيئة؟</p>"], ["3. Present Continuous", "<p><b>Form:</b> I <b>am</b> · He / She / It <b>is</b> · You / We / They <b>are</b> + (not) + verb-ing</p><p><b>Use:</b> things happening <u>now</u>, and future plans (go, come, travel…). <b>Keywords:</b> now, look, listen, at the moment.</p><p><b>Questions:</b> Am / Is / Are + subject + verb-ing …? · Wh- + am / is / are + subject + verb-ing …?</p><p class=\"ex\">We are studying English now. · He is taking an exam tomorrow.</p><p><b>Not used</b> with: see, hear, smell · understand, know, remember · want, love, hate · own, have, belong to · be, can, must.</p>", "<p><b>المضارع المستمر:</b> نستخدمه للتعبير عن أشياء تحدث <u>الآن</u>، وللتعبير عن الخطط المستقبلية (غالبًا مع أفعال الذهاب والعودة والحركة).</p><p><b>التكوين:</b> I am / He, She, It is / You, We, They are + (not) + الفعل مضافًا إليه ing.</p><p><b>الكلمات الدالة:</b> now الآن · look انظر · listen استمع · at the moment في هذه اللحظة · at the present time في الوقت الحالي.</p><p><b>السؤال:</b> Am / Is / Are + الفاعل + الفعل-ing؟</p><p><b>لا نستخدمه مع:</b> أفعال الحواس (see, hear, smell, notice) · أفعال التفكير (understand, know, remember, realise, mean) · أفعال العاطفة (want, love, hate, wish, dislike) · أفعال الملكية (own, have, belong to, possess) · وأيضًا be, can, must, will, seem.</p><p class=\"ex\">We are studying English now. = نحن نذاكر الإنجليزية الآن.<br>He is taking an exam tomorrow. = سيؤدي امتحانًا غدًا.<br>Is Omar repairing his car? = هل عمر يُصلح سيارته؟<br>Where are they playing football? = أين يلعبون كرة القدم؟</p>"], ["4. Past Simple", "<p><b>Form:</b> subject + 2nd form of the verb (went, ate, moved…)</p><p><b>To be:</b> I / He / She / It → <b>was / wasn’t</b> · We / You / They → <b>were / weren’t</b></p><p><b>Negative:</b> didn’t + base verb · <b>Keywords:</b> yesterday, ago, last week, once, in 2010, in the past.</p><p class=\"ex\">Nada went to school yesterday. → Nada didn’t go to school yesterday.</p><p class=\"ex\">Dr. Samira Moussa was a hero. · I ate a cheese sandwich two hours ago.</p>", "<p><b>الماضي البسيط:</b> نستخدمه للتعبير عن أحداث بدأت وانتهت في الماضي.</p><p><b>التكوين:</b> الفاعل + التصريف الثاني للفعل (went, ate, moved…).</p><p><b>فعل to be:</b> was مع I / He / She / It والمفرد، و were مع We / You / They والجمع. والنفي: wasn’t / weren’t.</p><p><b>النفي مع باقي الأفعال:</b> didn’t + المصدر (يرجع الفعل لأصله).</p><p><b>الكلمات الدالة:</b> yesterday أمس · ago منذ · last week الأسبوع الماضي · once ذات مرة · in 2010 في عام 2010 · in the past في الماضي · in ancient times في العصور القديمة.</p><p class=\"ex\">Nada went to school yesterday. = ذهبت ندى إلى المدرسة أمس.<br>Nada didn’t go to school yesterday. = لم تذهب ندى إلى المدرسة أمس.<br>Dr. Samira Moussa was a hero. = كانت د. سميرة موسى بطلة.<br>I ate a cheese sandwich two hours ago. = أكلت ساندويتش جبن منذ ساعتين.</p>"]]};
const TEACHER_EMAIL="mostafa.fahmy100@gmail.com";

const $=id=>document.getElementById(id);let ex=0,cur=0,ans=[],t0=0,nm="";
const grade=p=>p>=90?"Excellent · ممتاز":p>=80?"Very Good · جيد جدًا":p>=65?"Good · جيد":p>=50?"Pass · مقبول":"Needs more practice · محتاج مذاكرة";
function go(v){["home","test","result","review"].forEach(x=>$(x).classList.toggle("hidden",x!==v));scrollTo(0,0)}
$("exb").innerHTML=D.E.map((_,i)=>`<button class="btn" data-e="${i}" style="padding:14px">Exam ${i+1}</button>`).join("");
function start(e){nm=$("nm").value.trim();if(!nm){alert("Please write your name. / اكتب اسمك");$("nm").focus();return}ex=e;ans=[];cur=0;t0=Date.now();go("test");show()}
function show(){const Q=D.E[ex],q=Q[cur],a=ans[cur],sc=ans.filter(x=>x&&x.ok).length;
 $("test").innerHTML=`<div class="top"><span>Exam ${ex+1} · Question ${cur+1} of ${Q.length}</span><span>Score: ${sc}</span></div><div class="track"><div class="fill" style="width:${cur/Q.length*100}%"></div></div><div class="card"><p class="qt">${q[0]}</p><div class="opts">${q[1].map((o,j)=>{let c="";if(a){if(j===q[2])c="ok";else if(j===a.j)c="bad"}return `<button class="${c}" ${a?"disabled":""} data-j="${j}">${"abcd"[j]}) ${o}</button>`}).join("")}</div></div><div class="nav"><button class="btn alt" id="bk" ${cur?"":"disabled"}>← Back</button><button class="btn" id="nx">${cur===Q.length-1?"Finish ✓":"Next →"}</button></div>`;scrollTo(0,0)}
function pick(j){if(ans[cur])return;ans[cur]={ok:j===D.E[ex][cur][2],j};show()}
async function finish(){const Q=D.E[ex],T=Q.length,ok=ans.filter(x=>x&&x.ok).length,sk=Q.filter((_,i)=>!ans[i]).length,bad=T-ok-sk,pct=Math.round(ok/T*100),mins=Math.max(1,Math.round((Date.now()-t0)/60000));
 const wrong=Q.map((q,i)=>[q,i]).filter(([q,i])=>!ans[i]||!ans[i].ok);
 let rep=`Learning English – Mr. Mostafa Nasar\nFirst Year Preparatory – October Exam ${ex+1}\n\nName: ${nm}\nScore: ${ok} / ${T} (${pct}%)\nCorrect: ${ok} | Wrong: ${bad} | Skipped: ${sk}\nTime: ${mins} min\nGrade: ${grade(pct)}\n`;
 if(wrong.length){rep+="\nMistakes:\n"+wrong.map(([q,i])=>`Q${i+1}: ${q[1][q[2]]}${ans[i]?" (student chose: "+q[1][ans[i].j]+")":" (skipped)"}`).join("\n")}
 window._rep=rep;const href=`mailto:${TEACHER_EMAIL}?subject=${encodeURIComponent("Exam result – "+nm)}&body=${encodeURIComponent(rep)}`;
 $("result").innerHTML=`<div style="text-align:center;font-size:44px">🏆</div><div class="score">${ok} / ${T}</div><p style="text-align:center;font-weight:700;font-size:19px;margin:4px 0">${grade(pct)}</p><p style="text-align:center;color:var(--muted);margin:0">${nm} · Exam ${ex+1}</p><div class="stats"><div><b style="color:var(--ok)">${ok}</b>Correct</div><div><b style="color:var(--bad)">${bad}</b>Wrong</div><div><b>${sk}</b>Skipped</div><div><b>${pct}%</b>Percentage</div><div><b>${mins}m</b>Time</div></div><div id="sendst" style="text-align:center;font-weight:600;margin:6px 0">⏳ Sending your result to your teacher…</div>${wrong.length?`<h2>Review your mistakes</h2>`+wrong.map(([q,i])=>`<div class="mist">${i+1}. ${q[0]}<br>✔ <b>${q[1][q[2]]}</b></div>`).join(""):`<p style="text-align:center;font-weight:700;color:var(--ok)">Perfect score! 🎉</p>`}<div class="actions"><button class="btn" id="torev">📖 Revision</button><a class="btn alt" target="_blank" rel="noopener" href="${href}">📧 Send manually</a><button class="btn alt" id="copy">Copy result</button><button class="btn alt" id="home2">Choose another exam</button></div>`;
 go("result");
 try{const r=await fetch("https://formspree.io/f/xgojreqn",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:"New Student Result — "+nm+" — Prep 1 Exam "+(ex+1)+" — "+ok+"/"+T,student_name:nm,exam:"First Prep – October Exam "+(ex+1),overall_score:ok+"/"+T+" ("+pct+"%)",grade:grade(pct),full_report:rep,date:new Date().toLocaleString("en-GB")})});
  if(!r.ok)throw 0;$("sendst").innerHTML="✅ Your result was sent to your teacher";$("sendst").style.color="var(--ok)"}catch(e){$("sendst").innerHTML="⚠️ Automatic sending failed. Please press “Send manually”";$("sendst").style.color="var(--bad)"}}
/* revision */
const TABS=["Words","Expressions","Synonyms & Antonyms","Prefixes & Suffixes","Grammar"];let tab=0,hideAr=false,q="";
function say(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\(.*\)/,""));u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function rv(){$("tabs").innerHTML=TABS.map((t,i)=>`<button data-t="${i}" class="${i===tab?"on":""}">${t}</button>`).join("");let h="";
 if(tab<2){const L=tab?D.X:D.V;h=`<div class="tools"><input type="text" id="sq" placeholder="Search…" value="${q}"><button class="btn alt" id="hid">${hideAr?"Show Arabic":"Test myself"}</button></div><div class="card ${hideAr?"hide":""}" id="vl">`+L.filter(r=>(r[0]+r[r.length-1]).toLowerCase().includes(q.toLowerCase())).map(r=>`<div class="vc"><div><b>${r[0]}</b>${tab?"":`<small>${r[1]}</small>`}</div><div style="display:flex;align-items:center;gap:8px"><span class="ar">${r[r.length-1]}</span><button class="sp" data-s="${r[0].replace(/"/g,"")}" aria-label="Listen">🔊</button></div></div>`).join("")+`</div>`}
 else if(tab===2)h=`<div class="card" style="overflow-x:auto"><table><tr><th>Word</th><th>Synonym ≈</th><th>Antonym ≠</th></tr>${D.SA.map(r=>`<tr>${r.map((c,i)=>`<td>${i?c[0]:"<b>"+c[0]+"</b>"}<span class="a2">${c[1]}</span></td>`).join("")}</tr>`).join("")}</table></div>`;
 else if(tab===3)h=`<div class="card" style="overflow-x:auto"><table><tr><th>Prefix / Suffix</th><th>Use</th><th>Examples</th></tr>${D.AF.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}<span class="a2">${r[2]}</span></td><td>${r[3]}<span class="a2">${r[4]}</span></td></tr>`).join("")}</table></div>`;
 else h=D.G.map((g,i)=>`<details ${i?"":"open"}><summary>${g[0]}</summary><div>${g[1]}<div class="arn">${g[2]}</div></div></details>`).join("");
 $("rvbody").innerHTML=h;const s=$("sq");if(s&&q){s.focus();s.setSelectionRange(q.length,q.length)}}
document.addEventListener("input",e=>{if(e.target.id==="sq"){q=e.target.value;rv()}});
document.addEventListener("click",e=>{const ar=e.target.closest(".ar");if(ar&&hideAr){ar.classList.toggle("sh");return}
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.e!==undefined)start(+t.dataset.e);else if(t.dataset.j!==undefined)pick(+t.dataset.j);
 else if(t.id==="nx"){if(cur===D.E[ex].length-1)finish();else{cur++;show()}}else if(t.id==="bk"){cur--;show()}
 else if(t.id==="gorev"||t.id==="torev"){rv();go("review")}else if(t.id==="rvback"||t.id==="home2"){go("home")}
 else if(t.dataset.t!==undefined){tab=+t.dataset.t;q="";rv()}else if(t.id==="hid"){hideAr=!hideAr;rv()}
 else if(t.dataset.s)say(t.dataset.s);
 else if(t.id==="copy"){navigator.clipboard&&navigator.clipboard.writeText(window._rep).then(()=>t.textContent="Copied ✓").catch(()=>{})}});

</script></body></html>
